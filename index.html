    <!-- Critical CSS for above-the-fold content (pre-render shell) -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #0A0A0A; color: #E0E0E0; font-family: 'Inter', 'Helvetica Neue', sans-serif; line-height: 1.6; }
      .shell-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: transparent; }
      .shell-nav-inner { max-width: 80rem; margin: 0 auto; padding: 0 1.5rem; display: flex; height: 5rem; align-items: center; justify-content: space-between; }
      .shell-logo { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 1.875rem; letter-spacing: 0.05em; color: #FAFAFA; text-decoration: none; }
      .shell-logo-sub { display: block; font-size: 0.75rem; color: rgba(224,224,224,0.6); letter-spacing: 0.05em; font-family: 'Inter', sans-serif; }
      .shell-hero { position: relative; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; overflow: hidden; padding: 8rem 0 3rem; background: #0A0A0A; }
      .shell-hero-glow1 { position: absolute; top: -8rem; left: -8rem; width: 600px; height: 600px; background: rgba(0,229,255,0.2); border-radius: 50%; filter: blur(120px); }
      .shell-hero-glow2 { position: absolute; bottom: -8rem; right: -8rem; width: 500px; height: 500px; background: rgba(224,64,251,0.15); border-radius: 50%; filter: blur(100px); }
      .shell-hero-content { position: relative; z-index: 10; max-width: 80rem; margin: 0 auto; padding: 0 1.5rem; text-align: center; }
      .shell-hero h1 { font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; line-height: 1; letter-spacing: 0.05em; text-transform: uppercase; color: #FAFAFA; font-size: clamp(4rem, 12vw, 10rem); }
      .shell-hero h1 .cyan { color: #00E5FF; text-shadow: 0 0 10px rgba(0,229,255,0.5), 0 0 20px rgba(0,229,255,0.5), 0 0 40px rgba(0,229,255,0.5); }
      .shell-hero-sub { max-width: 42rem; margin: 0 auto; color: rgba(224,224,224,0.8); font-size: 1.125rem; margin-top: 1.5rem; }
      .shell-hero-cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin-top: 3rem; }
      .shell-btn-primary { display: inline-flex; align-items: center; gap: 0.5rem; padding: 1rem 2rem; background: #00E5FF; color: #0A0A0A; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 0.875rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; border: none; }
      .shell-btn-outline { display: inline-flex; align-items: center; padding: 1rem 2rem; background: transparent; color: #00E5FF; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 0.875rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; border: 1px solid #00E5FF; }
      .shell-btn-ghost { display: inline-flex; align-items: center; padding: 1rem 2rem; background: transparent; color: #E0E0E0; font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 0.875rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; border: 1px solid #3A3A3A; }
      .shell-wrap { min-height: 100vh; }
    </style>
